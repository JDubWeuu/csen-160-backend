events {
    worker_connections 1024;
}

http {
    upstream auth-service {
        server host.docker.internal:8080;
    }

    upstream order-service {
        server host.docker.internal:8081;
    }

    upstream cart-service {
        server host.docker.internal:8082;
    }

    server {
        listen 80;
        server_name localhost;

        # Route authentication service root endpoint (with or without trailing slash)
        location = /api/auth {
            proxy_pass http://auth-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/ {
            proxy_pass http://auth-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location = / {
            return 200 'API Gateway is running!\n';
            add_header Content-Type text/plain;
        }

        # Route authentication service endpoints
        location /api/auth/ {
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Internal location for token validation
        location = /api/auth/validate {
            internal;
            proxy_pass http://auth-service/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            
            # Capture response headers from auth service
            proxy_pass_header X-User-Id;
            proxy_pass_header X-Username;
            proxy_pass_header X-User-Email;
        }

        # Route ordering service root endpoint (requires authentication)
        location = /api/orders {
            # Validate token with auth service before forwarding
            auth_request /api/auth/validate;
            
            # Capture user information from validation response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $user_email $upstream_http_x_user_email;
            
            # Forward to order service only if validation succeeds
            proxy_pass http://order-service/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Forward user information to order service
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header X-User-Email $user_email;
            
            # CORS headers (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Route ordering service endpoints (requires authentication)
        location /api/orders/ {
            # Validate token with auth service before forwarding
            auth_request /api/auth/validate;
            
            # Capture user information from validation response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $user_email $upstream_http_x_user_email;
            
            # Forward to order service only if validation succeeds
            proxy_pass http://order-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Forward user information to order service
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header X-User-Email $user_email;
            
            # CORS headers (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Route user endpoints (if any)
        location /api/users/ {
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Route cart service endpoints (requires authentication)
        location = /api/cart {
            # Validate token with auth service before forwarding
            auth_request /api/auth/validate;
            
            # Capture user information from validation response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $user_email $upstream_http_x_user_email;
            
            # Forward to cart service only if validation succeeds
            proxy_pass http://cart-service/api/cart;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Forward user information to cart service
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header X-User-Email $user_email;
            
            # CORS headers (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /api/cart/ {
            # Validate token with auth service before forwarding
            auth_request /api/auth/validate;
            
            # Capture user information from validation response
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $user_email $upstream_http_x_user_email;
            
            # Forward to cart service only if validation succeeds
            proxy_pass http://cart-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Forward user information to cart service
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
            proxy_set_header X-User-Email $user_email;
            
            # CORS headers (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}

